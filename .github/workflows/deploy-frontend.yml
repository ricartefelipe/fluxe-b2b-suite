# Cloudflare Pages — produção (somente ramo master).
#
# Staging dos fronts está no Railway (ramo develop nos projetos Railway), ver docs/URLS-STAGING.md.
# Não dispare este workflow em develop: evita build duplicado sem deploy e mantém um destino claro por ramo.
#
# Pré-requisito imposto, não apenas documentado: o job `require-ci` espera o workflow "CI"
# (deploy.yml) deste mesmo SHA ficar verde antes de qualquer publicação. A validação completa
# (lint, test, e2e) continua lá; aqui só: artefacto + wrangler.
name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - 'saas-suite-ui/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A publicacao nao avanca enquanto o workflow "CI" **deste mesmo SHA** nao estiver verde.
  #
  # Antes, "CI" e a publicacao disparavam em paralelo no mesmo push: o artefacto ia para fora mesmo
  # com lint, testes ou e2e reprovados, e o deploy verde dava a impressao de commit aprovado. A
  # verificacao e sempre contra a ultima tentativa deste commit — nunca contra o "ultimo verde" de
  # outro commit ou outro evento.
  require-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the CI workflow on this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 30 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });

              const runs = data.workflow_runs.filter((r) => r.name === 'CI');
              if (runs.length === 0) {
                core.setFailed(
                  `Nenhuma execucao do workflow "CI" encontrada para o SHA ${sha}. ` +
                  'A publicacao exige a CI deste commit.'
                );
                return;
              }

              runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const run = runs[0];
              core.info(`CI run ${run.id}: status=${run.status} conclusion=${run.conclusion}`);

              if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info('CI deste SHA esta verde; publicacao liberada.');
                  return;
                }
                core.setFailed(`CI deste SHA terminou como "${run.conclusion}". Publicacao bloqueada.`);
                return;
              }

              if (Date.now() > deadline) {
                core.setFailed('Tempo esgotado aguardando a CI deste SHA.');
                return;
              }
              await sleep(20000);
            }

  cloudflare-pages:
    needs: require-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-suite-ui
    strategy:
      matrix:
        app:
          - name: shop
            project: fluxe-shop
            output: dist/apps/shop/browser
          - name: ops-portal
            project: fluxe-ops-portal
            output: dist/apps/ops-portal/browser
          - name: admin-console
            project: fluxe-admin-console
            output: dist/apps/admin-console/browser
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare configuration
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare Pages omitido::Defina CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets para publicar."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: saas-suite-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app.name }} (production)
        run: pnpm nx build ${{ matrix.app.name }} --configuration=production

      - name: Inject runtime config (production)
        env:
          CORE_API_BASE_URL: ${{ vars.CORE_API_BASE_URL }}
          ORDERS_API_BASE_URL: ${{ vars.ORDERS_API_BASE_URL }}
          PAYMENTS_API_BASE_URL: ${{ vars.PAYMENTS_API_BASE_URL }}
          KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
        run: |
          OUTPUT_DIR="${{ matrix.app.output }}"
          cat > "${OUTPUT_DIR}/config.json" << CONF
          {
            "coreApiBaseUrl": "${CORE_API_BASE_URL:-https://api.fluxe.com.br}",
            "ordersApiBaseUrl": "${ORDERS_API_BASE_URL:-https://orders.fluxe.com.br}",
            "paymentsApiBaseUrl": "${PAYMENTS_API_BASE_URL:-https://payments.fluxe.com.br}"
          }
          CONF
          cat > "${OUTPUT_DIR}/config.keycloak.json" << KC
          {
            "url": "${KEYCLOAK_URL:-https://auth.fluxe.com.br}",
            "realm": "${KEYCLOAK_REALM:-fluxe}",
            "clientId": "${KEYCLOAK_CLIENT_ID:-${{ matrix.app.name }}}"
          }
          KC

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.app.output }} --project-name=${{ matrix.app.project }} --branch=${{ github.ref_name }}
          workingDirectory: saas-suite-ui
