name: Deploy Production

on:
  push:
    branches: [master]
    paths:
      - "docker-compose.prod.yml"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:
    inputs:
      saas_core_tag:
        description: "spring-saas-core image tag"
        default: "latest"
      orders_tag:
        description: "node-b2b-orders image tag"
        default: "latest"
      payments_tag:
        description: "py-payments-ledger image tag"
        default: "latest"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A publicacao nao avanca enquanto o workflow "CI" **deste mesmo SHA** nao estiver verde.
  #
  # Antes, "CI" e a publicacao disparavam em paralelo no mesmo push: o artefacto ia para fora mesmo
  # com lint, testes ou e2e reprovados, e o deploy verde dava a impressao de commit aprovado. A
  # verificacao e sempre contra a ultima tentativa deste commit — nunca contra o "ultimo verde" de
  # outro commit ou outro evento.
  require-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the CI workflow on this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 30 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });

              const runs = data.workflow_runs.filter((r) => r.name === 'CI');
              if (runs.length === 0) {
                core.setFailed(
                  `Nenhuma execucao do workflow "CI" encontrada para o SHA ${sha}. ` +
                  'A publicacao exige a CI deste commit.'
                );
                return;
              }

              runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const run = runs[0];
              core.info(`CI run ${run.id}: status=${run.status} conclusion=${run.conclusion}`);

              if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info('CI deste SHA esta verde; publicacao liberada.');
                  return;
                }
                core.setFailed(`CI deste SHA terminou como "${run.conclusion}". Publicacao bloqueada.`);
                return;
              }

              if (Date.now() > deadline) {
                core.setFailed('Tempo esgotado aguardando a CI deste SHA.');
                return;
              }
              await sleep(20000);
            }

  deploy:
    needs: require-ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Sem VPS_* nos secrets o deploy por SSH nao corre (ex.: producao so no Railway).
      - name: Check VPS credentials
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_SSH_KEY}" ] || [ -z "${VPS_USER}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=VPS deploy omitido::Defina VPS_HOST, VPS_USER e VPS_SSH_KEY nos secrets para activar deploy SSH. Com apenas Railway, o workflow fica verde."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.vps.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync deployment files to VPS
        if: steps.vps.outputs.configured == 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            docker-compose.prod.yml deploy/ scripts/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/fluxe-b2b-suite/

      - name: Deploy on VPS
        if: steps.vps.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
          set -euo pipefail
          cd ~/fluxe-b2b-suite

          # Override image tags if provided via workflow_dispatch
          if [ -n "${{ github.event.inputs.saas_core_tag || '' }}" ]; then
            export SAAS_CORE_TAG="${{ github.event.inputs.saas_core_tag }}"
          fi
          if [ -n "${{ github.event.inputs.orders_tag || '' }}" ]; then
            export ORDERS_TAG="${{ github.event.inputs.orders_tag }}"
          fi
          if [ -n "${{ github.event.inputs.payments_tag || '' }}" ]; then
            export PAYMENTS_TAG="${{ github.event.inputs.payments_tag }}"
          fi

          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
          DEPLOY_SCRIPT

      - name: Smoke test via SSH
        if: steps.vps.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'SMOKE'
          set -e
          echo "Smoke testing endpoints..."
          curl -sf http://127.0.0.1:80/health
          curl -sf http://127.0.0.1:8080/actuator/health/liveness
          curl -sf http://127.0.0.1:3000/v1/healthz
          curl -sf http://127.0.0.1:8000/healthz
          echo "All smoke tests passed."
          SMOKE

      - name: Cleanup SSH key
        if: always() && steps.vps.outputs.configured == 'true'
        run: rm -f ~/.ssh/deploy_key
